# Build, test and scan on the toolchain the goldens were recorded with:
# Ubuntu 24.04, gcc 13.3, x86-64. The 8.05B goldens skip themselves, since the
# blueprint is not in the repository.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans every commit

      - name: Check the toolchain
        run: |
          gcc --version | head -n 1
          python3 --version
          case "$(gcc -dumpfullversion)" in
            13.3.*) ;;
            *) echo "::error::the golden digests need gcc 13.3, found $(gcc -dumpfullversion)"; exit 1 ;;
          esac

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[test]"

      - name: Build
        run: make all

      - name: Test
        run: make check PYTHON=.venv/bin/python

      - name: Gitleaks (every commit)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml .
