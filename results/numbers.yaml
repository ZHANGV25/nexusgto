# Published NexusGTO numbers, each tied to the data that produced it.
#
# `python results/reproduce.py` recomputes every row marked `reproducible: true`
# from the result files listed in MANIFEST.sha256 and checks it against the
# value here, at the precision the value is written with.
#
# Conventions
#   value, se    the estimate and its standard error (bb/100 unless `unit` says
#                otherwise; 100 chips = 1 big blind, 100bb stacks, no rake)
#   ci95         mean +/- 1.96 SE
#   deals        independent units behind the estimate. A deal is one set of
#                cards played in all six seat rotations (match rows) or in both
#                heads-up seats (LBR rows)
#   metric       adjusted = AIVAT-adjusted (the published default); raw = without
#   seeds        master-seed range used; omitted = every seed in the file
#   data/sha256  the files the row is computed from, and their SHA-256
#   published    the wording used in prose, when it is a rounding of `value`
#   corrected_value, corrected_se, corrected_ci95
#                what the data gives, when a published figure is off; the
#                published figure stays in value/se/ci95, reproduce.py checks
#                against the corrected one and prints both. `note` says why
#   reason       for `reproducible: false`: why the number cannot be recomputed
#
# Arms (search configurations; results/README.md maps them to their flags):
#   blueprint                      the 8.05B blueprint, no search
#   first_config                   the first search configuration (13 Sep)
#   flop_only                      search on the flop only, the decision rule's comparator
#   flop_only_combo_prior          flop-only search with the combo prior, matched to the run below
#   all_streets_own_range          search on every street with own-range tracking (headline)
#   all_streets                    the same without own-range tracking
#   all_streets_serving_candidate  a later candidate without own-range tracking
#   blueprint_rerun                the blueprint again, seeds 9101-9104 of the nit and
#                                  maniac fields, rerun on 18 Nov 2026 with this release's
#                                  code because the original files were lost
#
# baseline     for paired rows: the arm subtracted; a list means several arms that
#              together cover the seeds, each deal taken from exactly one of them
#
# Fields (the five opponents): blueprint = five copies of the blueprint;
# nit and maniac = scripted deviations from it.

rows:

